schema = 1
wave_tables = ["SFX_WaveInstruments"]
audio_script_tail = 2
engine_bank_args = ["SFX_sweep"]
palette_tables = ["Palettes"]
why = "SFX_wave takes its table index from the command byte's low nibble (0-15), and Extended's SFX data reaches index 14, whose table word ($3423) points into home ROM; GetAudioCmdAndArgs reads a command and its two argument bytes, so a channel script that ends at its section boundary reads up to two bytes past it; SFX_sweep reads its argument with ld a, [hli] while the audio engine's own bank is mapped instead of wSFXBank, so a sweep command in a bank $44 or $45 SFX script reads the engine bank's byte at the argument address; LoadPaletteDataToBuffer copies the palette count from its Palettes entry times eight plus one bytes, and entries such as PALETTE_DAVID_PORTRAIT declare three palettes for a two-palette INCBIN, so the copy reads past the label's bytes"
