after = "\t\t\tDuelistVarResult hp = GetTurnDuelistVariable((uint8_t)(e + DUELVARS_ARENA_CARD_HP));\n\t\t\thl = hp.hl;\n\t\t\tif (hp.a >= 20u)\n\t\t\t\tcontinue;\n\t\t\td++;\n\t\t}\n\t\tuint8_t prizes = CountPrizes();"
case = "tests/profiles/extended/cases/special_attacks.py"
