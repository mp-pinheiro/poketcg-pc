source = "src/profiles/extended/home/boss_deck_set_up.c"
before = "\t\tif (entry == CARD_LIST_TERMINATOR || entry == card)\n\t\t\treturn (uint8_t)(entry == card);"
after = "\t\tif (entry == CARD_LIST_TERMINATOR || entry == card)\n\t\t\treturn 0u;"
case = "tests/profiles/extended/cases/boss_deck_set_up.py"
index = 1

