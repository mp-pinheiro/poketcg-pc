unblock = "primary: same as Func_c2a3/ScriptCommand_WalkPlayerToMasonLaboratory's established precedent, add multi-frame VBlank/interrupt simulation to the schema-2 harness so ExecuteNPCMovement's DoFrameIfLCDEnabled wait can terminate against the reference ROM in one probed call. Secondary: once that lands, also apply Func_2057's explicit-parameter-abstraction convention for the two caller-stack-resident af pairs (or port ScriptCommand_MoveArbitraryNPC first so both routines can be verified together via a real, non-isolated call chain), or land a separately reviewed permanent transform for this routine that verifies it via decomposed, already-green callee contracts instead of one end-to-end oracle run"

