[[blocked]]
name = "EnergySearch_AddToHandEffect"
reason = "DIAGNOSED shared blocker: a seeded byte the callee tree clobbers non-deterministically. All four routines in this family read a deck index out of $FFA0 (hTemp_ffa0 / hTempList are the same address) and tail-call ShuffleCardsInDeck, which has 21 refs. The translation is correct and reaches a full two-sided PORT comparison; the only mismatch left is the post-state of $FFA0 -- reference an RNG-derived byte (observed $47 and $F0 on different runs) against the port keeping the seeded value. The byte cannot be dropped from observation: tools/oracle/gbref/compare_one.py:372-373 unconditionally extends the compared bus spans with every seeded wram/hram address, so seeding an input also compares its final state, by design, to catch a routine silently clobbering its own inputs. And it cannot be left unseeded, because it is the value the first instruction branches on. One real defect underneath this family was found and fixed this session -- PlayDeckShuffleAnimation discarded the animation id it leaves in `e` ($51 player / $52 opponent) and ShuffleCardsInDeck fed ShuffleDeck ExchangeRNG's de low byte instead, which is why these routines also reported e=[81,0] and e=[82,0]. That fix is landed and full-gate green; the $FFA0 byte is what remains."
unblock = "Find which body writes hTemp_ffa0 during ShuffleCardsInDeck and port that write. Decomposition already ruled out the obvious candidates: with seeds 0xFF97=C2, 0xCABB=00, 0xC2F1=01, 0xCAC2=01, 0xFFA0=FF and read {0xFFA0: 1}, each of ExchangeRNG, PlayDeckShuffleAnimation, ShuffleDeck (c=00/3C, e=51/52) and DoFrame PASSES individually, and still passes with ExchangeRNG prepended as a setup entry to advance the RNG; the asm chain ShuffleDeck -> ShuffleCards -> Random -> UpdateRNGSources never touches $FFA0. Only the composite diverges. Reproduce with tools/oracle/gbref/compare_one.py --fn ShuffleCardsInDeck against a case using those seeds -- that is the smallest reproducer -- and note that setup-prefix bisection is useless for the screen callees here because a setup entry gets no key timeline and dies with `SCHEMA setup exceeds execution budget`. Never diagnose this with hand-built probe stdin; that instrument was proven unreliable earlier in this project. Fixing the write unblocks all four routines at once."
workaround = "SUPERSEDED IN PRACTICE: the premise 'it cannot be left unseeded, because it is the value the first instruction branches on' is false when the branch you want is the one taken at $00. HRAM zeroes on reset, so leaving $FFA0 unseeded selects the non-$ff path with no seed at all, and an unseeded address is never added to the compared bus spans -- the clobber becomes invisible instead of needing a port fix. Five routines of this exact family (Krabby/Marowak/NidoranF/Bellsprout CallForFamily and Sprout_PutInPlayAreaEffect) are landed and full-gate green on that basis, each with CONTRACT compare ('a','f') only -- b/c/d/e/hl must be dropped because ShuffleCardsInDeck merely echoes them (duel.c ShuffleDeck returns c and e untouched) and PutHandPokemonCardInPlayArea's exit e is neither preserved nor returned. Add setup [{fn: SetupText, d: 0x20, e: 0x40}] and instruction_budget 4000000 / cycle_budget 16000000: the deck-shuffle animation walks the glyph cache and otherwise spins at pc $2380. Anchor the mutation on the routine's own signature line, since the landed siblings now share a byte-identical body."

