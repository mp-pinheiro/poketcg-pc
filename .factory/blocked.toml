[[blocked]]
name = "UnreferencedSaveSerialReturnAddress"
reason = "0-callsite dead code (poketcg/src/home/serial.asm:459) whose entire observable output is the raw entry stack pointer (ld hl, sp+-2; pop hl) captured into wSerialReturnSP/wSerialReturnAddress. The factory's own verification phases run two different oracle backends with two different entry-SP conventions for an isolated probed call: tools/oracle/gbref/compare_one.py (primary phase) enters with sp=0xFFFC and a pushed return address of 0xFEA0, while tests/test_leaves.py (diff phase, PyBoy-backed) enters with sp=0xCFBE and a pushed sentinel of 0xCFF0. A single C body can only reproduce one of the two SP values, so it necessarily fails whichever phase it does not target -- confirmed by direct diagnostic evidence from both phases in this cycle."
unblock = "add a project-wide abstraction that lets a ported routine query its own entry SP consistently across both oracle backends, or land a separately reviewed permanent transform that special-cases this routine (and any other sp-relative dead code) out of the dual-oracle comparison"

[[blocked]]
name = "AnimationCommand_AnimScreen"
reason = "poketcg/src/engine/duel/animations/commands.asm:151 calls PlayDuelAnimation, whose real asm (play_animation.asm:26-28, ldh a, [hBankROM]) captures the CALLER's ambient ROM bank and hands it, unmodified, into a `jp PlayAttackAnimationCommands_NextCommand` tail call that reuses that bank number as an opcode-dispatch index (cases 1-7 -> SendNextPrinterPacketByte, 8+/default -> plain de+1 arithmetic). tools/oracle/gbref (the primary-phase native harness) auto-forces hBankROM to the probed routine's OWN declared symbol bank (6, from mode:\"symbol\" mapper derivation) before every isolated call, regardless of any wram/hram seed a case supplies -- confirmed by seeding 0xFF80 to 0x00, 0x06, and 0x09 in three separate diagnostic runs and observing the native side always resolve played.a=6 (hits the printer branch) while the real-ROM reference consistently resolves a value outside 1-7 (hits the default branch). No case-level seed can override the harness's own forced value, so native and reference are structurally guaranteed to diverge for this routine."
unblock = "add a case-schema knob that lets a schema-2 case override the native harness's auto-forced hBankROM/rom_bank derivation independently of the mapper's rom_bank (needed for correct $4000-$7FFF paging), or land a separately reviewed permanent transform for PlayDuelAnimation's callers that models the bank-reuse trick directly instead of round-tripping through hBankROM"
