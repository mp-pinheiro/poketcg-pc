[[blocked]]
name = "OverworldMap_HandleDPad"
reason = "poketcg/src/engine/overworld_map.asm:72 (bank 4, poketcg.sym 04:4e97) ends with pop bc / pop hl / ret after a leading push hl / pop hl no-op, a net +1-word stack imbalance relative to entry SP. Traced by hand and confirmed empirically (native probe, direct JSON invocation): the real calling convention requires the caller to have pushed two extra words [Y, X] before `call`, so this routine's own epilogue discards the harness's synthesized return address into bc, discards Y into hl, and treats X as the new `ret` target -- a computed-jump trick, not a bug. The schema-2 harness's single-frame call() (tools/oracle/pyboy_oracle.py) only ever pushes one sentinel return address at STACK_TOP-2 and explicitly forbids seeding the $CF00-$D000 RESERVED window that would hold any pre-pushed [Y, X], so a normal primary case can never supply them: the corrupted `ret` jumps to whatever pb.memory leaves at STACK_TOP+2..3 (zero after _reset_ram), which is not the SPIN sentinel and never fires the completion hook, timing out at MAX_FRAMES. The `completion: {\"mode\": \"pre-ret\", \"pc\": ...}` escape hatch (used successfully by CopyGfxData, ZeroRAM, DuelTransmissionError, all bank-0 routines) is not usable either: pyboy_oracle.py's `_arm()` always calls `hook_register(0, addr, ...)` with bank hardcoded to 0, and pyboy's hook_register is bank-specific, so a stop_pc inside this routine's own bank 4 (0x4eb9, the `.no_transition` label right before the corrupting pop/pop/ret) never fires -- confirmed the process never returns and must be killed after several minutes with the hook silently never triggering."
unblock = "add a `bank` field to the schema-2 completion dict (threaded through test_leaves.py/pyboy_oracle.py's `_arm`) so a pre-ret stop_pc can target a banked routine's own bank, or add a case-schema knob to pre-push extra stack words below the synthesized return address (and let RESERVED grow accordingly) so the real push/pop calling convention can be honored end to end, or land a separately reviewed permanent transform for this routine and any other stack-computed-jump idiom the disassembly still contains"

