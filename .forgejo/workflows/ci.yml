name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    if: github.repository == 'fairfruit/poketcg-pc'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: node:24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install python3, jq, just and git-cliff
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl --proto '=https' --tlsv1.2 -LsSf https://astral.sh/uv/install.sh \
            | env UV_INSTALL_DIR=/usr/local/bin sh
          uv python install 3.13
          ln -sf "$(uv python find 3.13)" /usr/local/bin/python3
          arch="$(uname -m)"
          case "$arch" in
            x86_64) jq_arch=amd64; cliff_arch=x86_64 ;;
            aarch64) jq_arch=arm64; cliff_arch=aarch64 ;;
            *) echo "unsupported arch: $arch" >&2; exit 1 ;;
          esac
          curl -fsSL -o /usr/local/bin/jq \
            "https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-${jq_arch}"
          chmod +x /usr/local/bin/jq
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --tag 1.58.0 --to /usr/local/bin
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/git-cliff.tar.gz \
            "https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-${cliff_arch}-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/git-cliff.tar.gz --strip-components=1 -C /tmp
          install -m755 /tmp/git-cliff /usr/local/bin/git-cliff
      - name: Validate changelog generation
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git cliff "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --strip header >/dev/null
          else
            git cliff --unreleased --strip header >/dev/null
          fi
      - name: Lint probe adapters
        run: python3 tools/lint_adapters.py
      - name: Ensure .jj marker
        run: mkdir -p .jj
      - name: Verify PreToolUse guards
        run: just verify-hooks
      - name: Check progress report is current
        run: python3 tools/progress/report.py check

  deploy:
    if: github.repository == 'fairfruit/poketcg-pc' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: node:24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy dashboard to Cloudflare Pages
        run: npx wrangler@4 pages deploy site/ --project-name poketcg-pc --branch main
      - name: Confirm the live dashboard serves this commit's data
        run: |
          set -euo pipefail
          jq_arch=amd64; [ "$(uname -m)" = "aarch64" ] && jq_arch=arm64
          curl -fsSL -o /usr/local/bin/jq "https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-${jq_arch}" && chmod +x /usr/local/bin/jq
          want_commit=$(jq -r .commit        site/data/progress.json)
          want_gen=$(jq    -r .generated_at  site/data/progress.json)
          for i in $(seq 1 10); do
            live=$(curl -fsS --max-time 20 https://poketcg-pc.pages.dev/data/progress.json || echo '{}')
            live_commit=$(printf '%s' "$live" | jq -r '.commit // empty')
            live_gen=$(printf    '%s' "$live" | jq -r '.generated_at // empty')
            echo "attempt $i: live=$live_commit/$live_gen want=$want_commit/$want_gen"
            if [ "$live_commit" = "$want_commit" ] && [ "$live_gen" = "$want_gen" ]; then
              echo "dashboard is serving this commit's snapshot"
              exit 0
            fi
            sleep 15
          done
          echo "live dashboard never converged to $want_commit/$want_gen"
          exit 1

  release:
    if: github.repository == 'fairfruit/poketcg-pc' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: node:24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install jq and git-cliff
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          arch="$(uname -m)"
          case "$arch" in
            x86_64) jq_arch=amd64; cliff_arch=x86_64 ;;
            aarch64) jq_arch=arm64; cliff_arch=aarch64 ;;
            *) echo "unsupported arch: $arch" >&2; exit 1 ;;
          esac
          curl -fsSL -o /usr/local/bin/jq \
            "https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-${jq_arch}"
          chmod +x /usr/local/bin/jq
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/git-cliff.tar.gz \
            "https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-${cliff_arch}-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/git-cliff.tar.gz --strip-components=1 -C /tmp
          install -m755 /tmp/git-cliff /usr/local/bin/git-cliff
      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          git fetch origin main --tags
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "source $GITHUB_SHA was superseded by main $current; no release"
            echo "cut=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          message="$(git log -1 --format=%s)"
          case "$message" in
            chore\(release\):*|chore\(progress\):\ daily\ snapshot)
              echo "generated commit does not cut a release"
              echo "cut=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          next=$(git cliff --bump --unreleased --context | jq -r 'map(select(.version != null and ((.commits // []) | length > 0))) | .[0].version // empty | ltrimstr("v")')
          cur=$(tr -d '[:space:]' < VERSION 2>/dev/null || echo none)
          {
            echo "next=$next"
            echo "current=$cur"
            if [ -n "$next" ] && [ "$next" != "$cur" ]; then echo "cut=true"; else echo "cut=false"; fi
          } >> "$GITHUB_OUTPUT"
      - name: Cut release
        if: steps.ver.outputs.cut == 'true'
        run: |
          set -euo pipefail
          next="${{ steps.ver.outputs.next }}"
          printf '%s\n' "$next" > VERSION
          git cliff --bump --unreleased -o CHANGELOG.md
          git config user.name  "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@noreply.forgejo.yfrit.com"
          git add VERSION CHANGELOG.md
          git commit -m "chore(release): v${next}"
          git tag "v${next}"
          git push origin HEAD:main
          git push origin "v${next}"
      # The commit and tag are durable once pushed; the Release object needs
      # /api/v1, and one transient non-200 there used to orphan the tag for good
      # because nothing ever retried. v0.132.0 and v0.140.1 both lost their
      # object that way. Retry, treat an existing release as done, then fail loud.
      - name: Publish the release object
        if: steps.ver.outputs.cut == 'true'
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          next="${{ steps.ver.outputs.next }}"
          api="${GITHUB_API_URL:-${GITHUB_SERVER_URL%/}/api/v1}"
          git cliff --latest --strip header > /tmp/notes.md
          jq -n --arg t "v${next}" --rawfile b /tmp/notes.md \
             '{tag_name:$t,name:$t,body:$b}' > /tmp/release-request.json
          for delay in 0 5 15 30 60; do
            [ "$delay" = 0 ] || sleep "$delay"
            code=$(curl -s -o /tmp/release-response.json -w '%{http_code}' --max-time 30 \
                     -X POST -H "Authorization: token ${FORGEJO_TOKEN}" \
                     -H 'Content-Type: application/json' \
                     --data @/tmp/release-request.json \
                     "${api}/repos/${GITHUB_REPOSITORY}/releases")
            case "$code" in
              201)     echo "published release v${next}";      exit 0 ;;
              409|422) echo "release v${next} already exists"; exit 0 ;;
            esac
            echo "HTTP $code: $(head -c 300 /tmp/release-response.json)"
          done
          echo "Forgejo refused the Release object for v${next} on every attempt."
          echo "Commit and tag v${next} ARE pushed; only the Release object is missing."
          echo "Republish from the workstation (fj release create takes no notes file):"
          echo "  git cliff --latest --strip header > /tmp/notes.md"
          echo "  jq -n --arg t v${next} --rawfile b /tmp/notes.md '{tag_name:\$t,name:\$t,body:\$b}' > /tmp/rel.json"
          echo "  curl -fsS -X POST -H \"Authorization: token \$FJ_FORGEJO_TOKEN\" \\"
          echo "    -H 'Content-Type: application/json' --data @/tmp/rel.json \\"
          echo "    ${api}/repos/${GITHUB_REPOSITORY}/releases"
          exit 1
      # The push mirror replicates refs only, so the GitHub Release object needs
      # its own call. Posting before the mirror lands the tag would make GitHub
      # create v${next} itself, pointing at whatever main happened to be.
      - name: Mirror the release object to GitHub
        if: steps.ver.outputs.cut == 'true'
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_MIRROR_REPO: mp-pinheiro/poketcg-pc
        run: |
          set -euo pipefail
          next="${{ steps.ver.outputs.next }}"
          token=$(tools/gh_app_token.sh)
          auth="Authorization: Bearer ${token}"
          for delay in 0 5 15 30 60; do
            [ "$delay" = 0 ] || sleep "$delay"
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H "$auth" \
                     "https://api.github.com/repos/${GH_MIRROR_REPO}/git/ref/tags/v${next}")
            [ "$code" = "200" ] && break
          done
          if [ "$code" != "200" ]; then
            echo "tag v${next} never reached the GitHub mirror (HTTP $code)."
            echo "Refusing to POST: GitHub would create the tag at main instead."
            exit 1
          fi
          jq -n --arg t "v${next}" --rawfile b /tmp/notes.md \
             '{tag_name:$t,name:$t,body:$b,draft:false,make_latest:"true"}' \
             > /tmp/gh-release-request.json
          for delay in 0 5 15 30 60; do
            [ "$delay" = 0 ] || sleep "$delay"
            code=$(curl -s -o /tmp/gh-release-response.json -w '%{http_code}' --max-time 30 \
                     -X POST -H "$auth" -H 'Accept: application/vnd.github+json' \
                     --data @/tmp/gh-release-request.json \
                     "https://api.github.com/repos/${GH_MIRROR_REPO}/releases")
            case "$code" in
              201) echo "mirrored release v${next} to ${GH_MIRROR_REPO}"; exit 0 ;;
              422) echo "release v${next} already exists on the mirror";  exit 0 ;;
            esac
            echo "HTTP $code: $(head -c 300 /tmp/gh-release-response.json)"
          done
          echo "GitHub refused the Release object for v${next} on every attempt."
          echo "The tag is mirrored; only the GitHub Release is missing. Republish with:"
          echo "  GH_MIRROR_REPO=${GH_MIRROR_REPO} tools/gh_app_token.sh   # then POST"
          echo "  /repos/${GH_MIRROR_REPO}/releases with tag_name v${next}"
          exit 1
