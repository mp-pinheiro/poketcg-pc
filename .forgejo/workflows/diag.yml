name: diag
on:
  workflow_dispatch:
jobs:
  is-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: node:24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
    steps:
      - run: '[ "$(uname -m)" = "x86_64" ] && echo "IS_AMD64" || { echo "NOT_AMD64: $(uname -m)" >&2; exit 1; }'

  is-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: node:24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
    steps:
      - run: '[ "$(uname -m)" = "aarch64" ] && echo "IS_ARM64" || { echo "NOT_ARM64: $(uname -m)" >&2; exit 1; }'
