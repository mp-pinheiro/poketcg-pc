name: diag
on:
  workflow_dispatch:
jobs:
  clifftimed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: node:24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
    steps:
      - run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/git-cliff.tar.gz \
            https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz
          echo "download exit=$?"
          tar -xzf /tmp/git-cliff.tar.gz --strip-components=1 -C /tmp
          echo "extract exit=$?"
          install -m755 /tmp/git-cliff /usr/local/bin/git-cliff
          echo "install exit=$?"
          file /usr/local/bin/git-cliff || true
          uname -m
      - run: |
          timeout 8 git-cliff --version
          echo "version-exit=$?"
      - run: echo "reached step after version"

  archcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: node:24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
    steps:
      - run: uname -m && cat /etc/os-release | head -3

  cliffalt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: node:24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
    steps:
      - run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://astral.sh/uv/install.sh \
            | env UV_INSTALL_DIR=/usr/local/bin sh
      - run: |
          timeout 60 uv tool install git-cliff 2>&1 | tail -20
      - run: |
          timeout 8 "$HOME/.local/bin/git-cliff" --version || timeout 8 git-cliff --version
          echo "alt-version-exit=$?"
