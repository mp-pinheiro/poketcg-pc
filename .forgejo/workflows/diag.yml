name: diag
on:
  workflow_dispatch:
jobs:
  verifyhooks2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: node:24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --tag 1.58.0 --to /usr/local/bin
          curl -fsSL -o /usr/local/bin/jq \
            https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64
          chmod +x /usr/local/bin/jq
      - run: mkdir -p .jj
      - run: just verify-hooks && echo "verify-hooks OK with jq present"

  changelog2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: node:24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/git-cliff.tar.gz \
            https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/git-cliff.tar.gz --strip-components=1 -C /tmp
          install -m755 /tmp/git-cliff /usr/local/bin/git-cliff
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: git cliff --unreleased -vv --strip header
      - run: echo "reached end without set -e abort"
