name: release
# Auto changelog + auto semver after successful main CI. The release workflow
# validates the source SHA, then creates one generated release commit without
# recursively dispatching CI, release, or Pages.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'mp-pinheiro/poketcg-pc' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install git-cliff
        run: |
          gh release download v2.13.1 -R orhun/git-cliff -p "*x86_64-unknown-linux-gnu.tar.gz" -D /tmp --clobber
          tar -xzf /tmp/git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz --strip-components=1 -C /tmp
          sudo install -m755 /tmp/git-cliff /usr/local/bin/git-cliff
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          source="${{ github.event.workflow_run.head_sha || github.sha }}"
          git fetch origin main --tags
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$source" ]; then
            echo "source $source was superseded by main $current; no release"
            echo "cut=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          message="$(git log -1 --format=%s)"
          case "$message" in
            chore\(release\):*|chore\(progress\):\ daily\ snapshot)
              echo "generated commit $source does not cut a release"
              echo "cut=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          next=$(git cliff --bump --unreleased --context | jq -r 'map(select(.version != null and ((.commits // []) | length > 0))) | .[0].version // empty | ltrimstr("v")')
          cur=$(tr -d '[:space:]' < VERSION 2>/dev/null || echo none)
          {
            echo "next=$next"
            echo "current=$cur"
            if [ -n "$next" ] && [ "$next" != "$cur" ]; then echo "cut=true"; else echo "cut=false"; fi
          } >> "$GITHUB_OUTPUT"
      - name: Cut release
        if: steps.ver.outputs.cut == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          next="${{ steps.ver.outputs.next }}"
          printf '%s\n' "$next" > VERSION
          git cliff --bump --unreleased -o CHANGELOG.md
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md
          git commit -m "chore(release): v${next}"
          git tag "v${next}"
          git push origin HEAD:main
          git push origin "v${next}"
          git cliff --latest --strip header > /tmp/notes.md
          gh release create "v${next}" --title "v${next}" --notes-file /tmp/notes.md --latest
