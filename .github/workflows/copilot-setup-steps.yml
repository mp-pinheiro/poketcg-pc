name: "Copilot Setup Steps"
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev python3 python3-pip python3-venv pkg-config libpng-dev

      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash
          sudo cp ~/bin/just /usr/local/bin/

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install rgbds
        run: |
          curl -LsSf "https://github.com/gbdev/rgbds/releases/latest/download/rgbds-linux-x86_64.tar.xz" -o /tmp/rgbds.tar.xz
          sudo tar -xJf /tmp/rgbds.tar.xz -C /usr/local/bin

      - name: Restore pret checkout cache
        id: cache-pret
        uses: actions/cache@v4
        with:
          path: poketcg
          key: pret-poketcg-${{ hashFiles('tools/verify_oracle_artifacts.py') }}

      - name: Bootstrap pret disassembly
        run: just bootstrap

      - name: Restore oracle venv cache
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: /tmp/pbenv
          key: pbenv-${{ hashFiles('tools/oracle/uv.lock') }}

      - name: Install oracle venv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: just oracle-venv

      - name: Restore C build cache
        id: cache-build
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ hashFiles('CMakeLists.txt', 'src/mem.c', 'src/mem.h', 'src/probe.c', 'src/probe.h', 'src/probe_table.c') }}

      - name: Build C probe
        run: just build
