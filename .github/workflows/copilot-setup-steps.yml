name: "Copilot Setup Steps"
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev python3 python3-pip python3-venv pkg-config libpng-dev

      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash
          sudo cp ~/bin/just /usr/local/bin/

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          sudo cp ~/.local/bin/uv /usr/local/bin/

      - name: Install rgbds
        run: |
          curl -LsSf "https://github.com/gbdev/rgbds/releases/latest/download/rgbds-linux-x86_64.tar.xz" -o /tmp/rgbds.tar.xz
          sudo tar -xJf /tmp/rgbds.tar.xz -C /usr/local/bin

      - name: Bootstrap pret disassembly
        run: just bootstrap

      - name: Install oracle venv
        run: |
          if gh release download oracle-venv --repo mp-pinheiro/poketcg-pc --pattern 'pbenv.tar.zst' -O /tmp/pbenv.tar.zst; then
            echo "extracting pre-built venv..."
            sudo mkdir -p /tmp/pbenv
            sudo tar -xaf /tmp/pbenv.tar.zst -C /tmp
            /tmp/pbenv/bin/python --version
          else
            echo "no pre-built venv found, building from source..."
            just oracle-venv
          fi

      - name: Build C probe
        run: just build
