name: "Copilot Setup Steps"
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev python3 python3-pip python3-venv pkg-config libpng-dev

      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash
          sudo cp ~/bin/just /usr/local/bin/

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          sudo cp ~/.local/bin/uv /usr/local/bin/

      - name: Install rgbds
        run: |
          curl -LsSf "https://github.com/gbdev/rgbds/releases/latest/download/rgbds-linux-x86_64.tar.xz" -o /tmp/rgbds.tar.xz
          sudo tar -xJf /tmp/rgbds.tar.xz -C /usr/local/bin

      - name: Bootstrap pret disassembly
        run: just bootstrap

      - name: Install oracle venv
        run: |
          uv python install 3.12.3
          uv venv /tmp/pbenv --python 3.12.3 --managed-python
          uv pip install --python /tmp/pbenv/bin/python numpy cython pysdl2 pysdl2-dll packaging setuptools wheel

          ASSET_URL=$(curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/oracle-venv" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(next((a['url'] for a in r['assets'] if a['name']=='pyboy-prebuilt.tar.zst'), ''))" 2>/dev/null) || true
          if [ -n "$ASSET_URL" ]; then
            echo "downloading pre-built pyboy..."
            curl -fsSL \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o /tmp/pyboy.tar.zst \
              "$ASSET_URL"
            tar -xf /tmp/pyboy.tar.zst -C /tmp/pbenv/lib/python3.12/site-packages/
          else
            echo "building pyboy from source..."
            uv pip install --python /tmp/pbenv/bin/python pyboy
          fi
          /tmp/pbenv/bin/python -c "import pyboy; print('pyboy ok')"

      - name: Build C probe
        run: just build
