name: progress snapshot
on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: progress-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.repository == 'mp-pinheiro/poketcg-pc'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Build daily snapshot
        run: python3 tools/progress/report.py build
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/progress.json site/data/history.jsonl
          if git diff --cached --quiet; then
            echo "Today's snapshot already exists"
            exit 0
          fi
          git commit -m "chore(progress): daily snapshot"
          git push origin HEAD:main
