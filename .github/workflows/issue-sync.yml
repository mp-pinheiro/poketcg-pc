name: issue synchronization

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the recorded plan after review
        required: true
        default: false
        type: boolean
      migrate:
        description: Run the explicit one-time legacy migration
        required: false
        default: false
        type: boolean
      resume_run_id:
        description: Run ID containing an interrupted apply checkpoint
        required: false
        default: ''
        type: string
  schedule:
    - cron: '17 3 * * 1'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: issue-synchronization
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'mp-pinheiro/poketcg-pc'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run offline issue-model check
        run: python3 tools/factory/issue_model_check.py
      - name: Restore interrupted apply checkpoint
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: issue-apply-checkpoint-${{ inputs.resume_run_id }}
          path: .factory
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Fetch managed issue snapshot
        if: github.event_name != 'workflow_dispatch' || inputs.resume_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/factory/issues.py fetch
      - name: Compute deterministic reconciliation plan
        if: (github.event_name != 'workflow_dispatch' || inputs.resume_run_id == '') && (github.event_name != 'workflow_dispatch' || inputs.migrate != true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/factory/issues.py plan --json
      - name: Compute deterministic migration plan
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id == '' && inputs.migrate == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/factory/issues.py plan --migrate --json
      - name: Upload dry-run plan
        if: github.event_name != 'workflow_dispatch' || inputs.resume_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: issue-plan-${{ github.run_id }}
          path: .factory/issues-plan.json
      - name: Apply reviewed plan
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/factory/issues.py apply --limit 10 --batches 50 --require-complete
      - name: Verify completed migration
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true && inputs.migrate == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/factory/issues.py verify --live --complete-migration
      - name: Verify completed reconciliation
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true && inputs.migrate != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/factory/issues.py verify --live
      - name: Upload interrupted apply checkpoint
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.apply == true
        uses: actions/upload-artifact@v4
        with:
          name: issue-apply-checkpoint-${{ github.run_id }}
          path: |
            .factory/issues-plan.json
            .factory/issues-apply-state.json
          if-no-files-found: error
