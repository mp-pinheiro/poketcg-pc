name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    if: github.repository == 'mp-pinheiro/poketcg-pc'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp the deployed commit into the served report
        run: |
          jq --arg sha "${{ github.sha }}" --arg repo "${{ github.repository }}" \
             --argjson ts "$(date +%s)" \
             '.commit = $sha[0:12] | .commit_url = "https://github.com/" + $repo + "/commit/" + $sha | .generated_at = $ts' \
             site/data/progress.json > /tmp/progress.json
          mv /tmp/progress.json site/data/progress.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
