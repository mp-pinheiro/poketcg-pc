name: ci
# Validates that git-cliff can parse the history and cliff.toml. Because
# cliff.toml sets require_conventional = true, this also enforces Conventional
# Commits on every pushed commit (belt-and-suspenders for the local hook).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install git-cliff
        run: |
          v=v2.13.1
          curl -sSL -H "User-Agent: curl" "https://github.com/orhun/git-cliff/releases/download/$v/git-cliff-$v-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --strip-components=1 -C /tmp
          sudo install -m755 /tmp/git-cliff /usr/local/bin/git-cliff
      - name: Validate changelog generation
        run: git cliff --unreleased --strip header >/dev/null

  # Gate against probe adapters that reimplement the routine they marshal (#19).
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint probe adapters
        run: python3 tools/lint_adapters.py

  # Verify the jj/git PreToolUse guards still enforce (docs/jj-workflow.md).
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Ensure .jj marker (hooks no-op without it; CI has no real jj repo)
        run: mkdir -p .jj
      - name: Verify PreToolUse guards
        run: just verify-hooks


  # Committed progress data must match tests/routines.py + the pinned inventory.
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check progress report is current
        run: python3 tools/progress/report.py check