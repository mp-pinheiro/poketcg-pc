name: ci
# Validates the repository's lightweight quality gates. The PR concurrency
# policy cancels obsolete commits while main and manual runs remain durable.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install git-cliff
        run: |
          gh release download v2.13.1 -R orhun/git-cliff -p "*x86_64-unknown-linux-gnu.tar.gz" -D /tmp --clobber
          tar -xzf /tmp/git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz --strip-components=1 -C /tmp
          sudo install -m755 /tmp/git-cliff /usr/local/bin/git-cliff
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate changelog generation
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git cliff "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --strip header >/dev/null
          else
            git cliff --unreleased --strip header >/dev/null
          fi
      - name: Lint probe adapters
        run: python3 tools/lint_adapters.py
      - uses: extractions/setup-just@v2
      - name: Ensure .jj marker
        run: mkdir -p .jj
      - name: Verify PreToolUse guards
        run: just verify-hooks
      - name: Check progress report is current
        run: python3 tools/progress/report.py check
      - name: Check managed issue model offline
        run: python3 tools/factory/issue_model_check.py